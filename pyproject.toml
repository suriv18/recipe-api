[project]
name = "recipe-api"
version = "0.1.0"
description = "Add your description here"
readme = "README.md"
authors = [
    { name = "suriv18", email = "wilton.sullcaray.r@gmail.com" }
]
requires-python = ">=3.15"
dependencies = [
    "alembic>=1.20.1",
    "fastapi>=0.162.0",
    "psycopg[binary]>=3.3.7",
    "pydantic-settings>=2.16.2",
    "sqlalchemy>=2.1.8",
    "uvicorn>=0.54.0",
]

[project.scripts]
recipe-api = "recipe_api:main"

[build-system]
requires = ["uv_build>=0.13.7,<0.14.0"]
build-backend = "uv_build"
