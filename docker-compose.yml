services:
  db:
    image: postgres:18
    container_name: recipe-db
    restart: unless-stopped
    environment:
      POSTGRES_USER: ${POSTGRES_USER:-postgres}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:?Define POSTGRES_PASSWORD en .env}
      POSTGRES_DB: ${POSTGRES_DB:-recipes_db}
    ports:
      - "5432:5432"
    volumes:
      # Postgres 18+ usa /var/lib/postgresql (subdirectorio por versión)
      - recipe_pgdata:/var/lib/postgresql
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U $${POSTGRES_USER} -d $${POSTGRES_DB}"]
      interval: 5s
      timeout: 3s
      retries: 10

volumes:
  recipe_pgdata:
